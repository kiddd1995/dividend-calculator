name: Update live fund data

on:
  workflow_dispatch:
  schedule:
    - cron: "30 14 * * *"

permissions:
  contents: write
  actions: write

concurrency:
  group: update-live-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Update live data
        run: npm run update:data

      - name: Test data
        run: npm run test:data

      - name: Build site
        run: npm run build

      - name: Check for live data changes
        id: changes
        shell: bash
        run: |
          if git diff --quiet -- public/data/assets-live.json public/data/exchange-live.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "沒有新資料，不建立 commit。"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "偵測到以下正式資料變更："
            git status --short -- public/data/assets-live.json public/data/exchange-live.json
          fi

      - name: Commit and push updated data
        if: steps.changes.outputs.changed == 'true'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data/assets-live.json public/data/exchange-live.json
          git commit -m "chore: update live fund data"
          git push origin HEAD:main

      - name: Trigger existing Pages deployment
        if: steps.changes.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy-pages.yml --ref main
